  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Special Elite', Courier, monospace;
      background-color: #121212;
      color: #e0e0e0;
      font-weight: 300;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: 300;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      max-width: 700px;
      font-weight: 300;
    }

    .links {
      margin: 10px 0 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a {
      text-decoration: none;
      font-weight: 300;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      padding: 4px 6px;
      font-size: 1rem;
    }

    a:hover {
      filter: brightness(1.4);
    }

    a i {
      margin-right: 5px;
    }

    /* Brand Styles */
    .x  { color: #ccc; font-family: 'Rajdhani', sans-serif; }
    .ig { color: #E1306C; font-family: 'Poppins', sans-serif; }
    .yt { color: #FF0000; font-family: 'Bebas Neue', cursive; }
    .gh { color: #bbb; font-family: 'Source Code Pro', monospace; }
    .li { color: #0A66C2; font-family: 'Roboto', sans-serif; }
    .gr { color: #C57A00; font-family: 'Merriweather', serif; }
    .fl { color: #0063DC; font-family: 'Nunito Sans', sans-serif; }
    .sp { color: #1DB954; font-family: 'Montserrat', sans-serif; }
    .rd { color: #FF4500; font-family: 'IBM Plex Sans', sans-serif; }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 0.95rem;
        padding: 0 10px;
      }

      a {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

  <div class="container">
